<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SRD 2026 | Workshop Request</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans text-slate-900">

    <div id="nav-bar" class="hidden bg-white border-b border-slate-200 px-8 py-4 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center gap-4">
            <div class="bg-indigo-600 text-white p-2 rounded-lg font-black text-xs shadow-lg shadow-indigo-200">SRD</div>
            <div>
                <p id="user-display" class="font-bold text-slate-800 text-xs leading-none"></p>
                <p class="text-[9px] font-black uppercase text-indigo-500 mt-1 tracking-widest">Workshop Personnel</p>
            </div>
        </div>
        <button id="logout-btn" class="text-[10px] font-black text-red-500 uppercase border border-red-100 px-4 py-2 rounded-xl hover:bg-red-50 transition">Sign Out</button>
    </div>

    <div id="login-container" class="flex items-center justify-center h-screen bg-slate-100">
        <div class="bg-white p-10 rounded-[2.5rem] shadow-xl w-full max-w-md border border-slate-200">
            <h2 class="text-2xl font-black text-slate-800 mb-6 text-center tracking-tight">Workshop Login</h2>
            <div class="space-y-4">
                <input type="email" id="login-email" placeholder="Email" class="w-full bg-slate-50 border border-slate-200 p-4 rounded-2xl outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
                <input type="password" id="login-password" placeholder="Password" class="w-full bg-slate-50 border border-slate-200 p-4 rounded-2xl outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
                <button id="login-btn" class="w-full bg-indigo-600 text-white font-bold py-4 rounded-2xl shadow-lg hover:bg-indigo-700 transition">Enter Portal</button>
            </div>
        </div>
    </div>

    <div id="app-container" class="hidden max-w-6xl mx-auto p-8">
        
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <div class="lg:col-span-1 space-y-4">
                <div class="bg-white p-6 rounded-[2rem] border border-slate-200 shadow-sm">
                    <h3 class="font-black text-slate-800 uppercase text-xs mb-4 tracking-widest">Inventory Search</h3>
                    <input type="text" id="mat-search" placeholder="Type name or ID..." class="w-full bg-slate-50 p-4 rounded-2xl border-none ring-1 ring-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none mb-2">
                    <button id="show-all-btn" class="text-[10px] font-bold text-indigo-600 hover:underline">Show All Items</button>
                    
                    <div id="search-results" class="mt-4 space-y-2 max-h-[500px] overflow-y-auto pr-2 custom-scrollbar">
                        </div>
                </div>
            </div>

            <div class="lg:col-span-2 space-y-6">
                <div class="bg-white p-8 rounded-[2rem] border border-slate-200 shadow-sm">
                    <h2 class="text-2xl font-black text-slate-800 mb-6">Create Requisition</h2>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
                        <div class="space-y-1">
                            <label class="text-[10px] font-black text-slate-400 uppercase ml-2">PRF Number</label>
                            <input type="text" id="prf-no" placeholder="e.g. PRF-101" class="w-full bg-slate-50 p-4 rounded-2xl border-none ring-1 ring-slate-200 outline-none">
                        </div>
                        <div class="space-y-1">
                            <label class="text-[10px] font-black text-slate-400 uppercase ml-2">SR / WO Number</label>
                            <input type="text" id="sr-no" placeholder="e.g. SR-505" class="w-full bg-slate-50 p-4 rounded-2xl border-none ring-1 ring-slate-200 outline-none">
                        </div>
                    </div>

                    <div class="overflow-hidden border border-slate-100 rounded-2xl mb-6">
                        <table class="w-full text-left bg-white">
                            <thead class="bg-slate-50 text-[10px] font-black text-slate-400 uppercase">
                                <tr>
                                    <th class="p-4">Material</th>
                                    <th class="p-4 w-32">Req. Qty</th>
                                    <th class="p-4 w-16 text-right"></th>
                                </tr>
                            </thead>
                            <tbody id="basket-body" class="divide-y divide-slate-50">
                                </tbody>
                        </table>
                        <div id="empty-msg" class="p-12 text-center text-slate-300 italic text-sm">
                            Add items from the inventory list to start.
                        </div>
                    </div>

                    <button id="submit-request" class="w-full bg-emerald-600 text-white font-black py-5 rounded-2xl shadow-xl shadow-emerald-100 hover:bg-emerald-700 transition active:scale-95">
                        Submit Request to Inventory Team
                    </button>
                </div>
            </div>

        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
        import { getDatabase, ref, onValue, get, push } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCLdwgFDeZRPGg666z5Vm9ZGJ74QfsP1Hg",
            authDomain: "srdprf-2026.firebaseapp.com",
            projectId: "srdprf-2026",
            databaseURL: "https://srdprf-2026-default-rtdb.firebaseio.com/",
            storageBucket: "srdprf-2026.firebasestorage.app",
            messagingSenderId: "736052583789",
            appId: "1:736052583789:web:5828ad0e5beb3b15218e64",
            measurementId: "G-J93X3PVNL4"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let masterInventory = [];
        let basket = [];

        // --- AUTH CHECK ---
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const emailKey = user.email.toLowerCase().replace(/\./g, ',');
                const snap = await get(ref(db, 'authorized_emails/' + emailKey));
                
                if (snap.exists() && snap.val().role === 'workshop') {
                    document.getElementById('login-container').classList.add('hidden');
                    document.getElementById('nav-bar').classList.remove('hidden');
                    document.getElementById('app-container').classList.remove('hidden');
                    document.getElementById('user-display').innerText = user.email;
                    loadInventory();
                } else {
                    alert("Unauthorized. Workshop access only.");
                    signOut(auth);
                }
            } else {
                document.getElementById('login-container').classList.remove('hidden');
                document.getElementById('app-container').classList.add('hidden');
                document.getElementById('nav-bar').classList.add('hidden');
            }
        });

        // --- INVENTORY LOGIC ---
        function loadInventory() {
            onValue(ref(db, 'inventory_list'), (snap) => {
                masterInventory = [];
                snap.forEach(c => masterInventory.push(c.val()));
                displayResults(masterInventory); // Default: Show all on load
            });
        }

        function displayResults(list) {
            const container = document.getElementById('search-results');
            if (list.length === 0) {
                container.innerHTML = '<p class="p-4 text-xs text-slate-400 italic">No materials found.</p>';
                return;
            }
            container.innerHTML = list.map(item => `
                <div onclick='addToBasket(${JSON.stringify(item)})' class="bg-slate-50 p-4 rounded-2xl border border-transparent hover:border-indigo-200 hover:bg-indigo-50 cursor-pointer transition group">
                    <div class="font-bold text-slate-800 text-sm group-hover:text-indigo-600 transition">${item.ProductName}</div>
                    <div class="flex justify-between mt-1">
                        <span class="text-[10px] font-mono text-slate-400">${item.ItemID}</span>
                        <span class="text-[10px] font-black text-slate-500 uppercase">${item.Unit}</span>
                    </div>
                </div>
            `).join('');
        }

        document.getElementById('mat-search').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = masterInventory.filter(i => 
                i.ProductName.toLowerCase().includes(query) || i.ItemID.toString().includes(query)
            );
            displayResults(filtered);
        });

        document.getElementById('show-all-btn').addEventListener('click', () => {
            document.getElementById('mat-search').value = '';
            displayResults(masterInventory);
        });

        // --- BASKET LOGIC ---
        window.addToBasket = (item) => {
            if (basket.find(b => b.ItemID === item.ItemID)) return;
            basket.push({ ...item, qty: 1 });
            renderBasket();
        };

        function renderBasket() {
            const tbody = document.getElementById('basket-body');
            const empty = document.getElementById('empty-msg');
            
            if (basket.length === 0) {
                tbody.innerHTML = '';
                empty.classList.remove('hidden');
                return;
            }
            
            empty.classList.add('hidden');
            tbody.innerHTML = basket.map((item, idx) => `
                <tr class="text-sm">
                    <td class="p-4">
                        <div class="font-bold">${item.ProductName}</div>
                        <div class="text-[10px] text-slate-400 font-mono">${item.ItemID}</div>
                    </td>
                    <td class="p-4">
                        <input type="number" value="${item.qty}" onchange="updateQty(${idx}, this.value)" class="w-full bg-slate-100 p-2 rounded-lg font-bold outline-none text-center">
                    </td>
                    <td class="p-4 text-right">
                        <button onclick="removeLine(${idx})" class="text-red-300 hover:text-red-500 transition">✕</button>
                    </td>
                </tr>
            `).join('');
        }

        window.updateQty = (idx, val) => basket[idx].qty = val;
        window.removeLine = (idx) => { basket.splice(idx, 1); renderBasket(); };

        // --- SUBMISSION ---
        document.getElementById('submit-request').addEventListener('click', async () => {
            const prfNo = document.getElementById('prf-no').value.trim();
            const srNo = document.getElementById('sr-no').value.trim();

            if (!prfNo || basket.length === 0) {
                alert("Please provide PRF Number and add at least one material.");
                return;
            }

            const payload = {
                prfNo,
                srNo,
                items: basket,
                status: 'Pending',
                createdBy: auth.currentUser.email,
                timestamp: Date.now()
            };

            try {
                await push(ref(db, 'prfs'), payload);
                alert("Request Sent Successfully!");
                basket = [];
                document.getElementById('prf-no').value = '';
                document.getElementById('sr-no').value = '';
                renderBasket();
            } catch (e) {
                alert("Error submitting: " + e.message);
            }
        });

        // Login Actions
        document.getElementById('login-btn').addEventListener('click', () => {
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-password').value;
            signInWithEmailAndPassword(auth, email, pass).catch(e => alert(e.message));
        });
        document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));

    </script>
</body>
</html>
