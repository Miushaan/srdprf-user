<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SRD 2026 | Workshop Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { overflow: hidden; height: 100vh; } 
        .app-height { height: calc(100vh - 64px); }
        .scroll-hide::-webkit-scrollbar { width: 5px; }
        .scroll-hide::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        .modal-bg { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); }
        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
        .animate-slide { animation: slideIn 0.3s ease-out; }
        .status-received { background: #dcfce7; color: #166534; }
        .status-pending { background: #fef9c3; color: #854d0e; }
        .status-cancelled { background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body class="bg-slate-100 font-sans text-slate-900">

    <header id="nav-bar" class="hidden h-16 bg-white border-b border-slate-200 px-6 flex justify-between items-center z-50 shadow-sm">
        <div class="flex items-center gap-3">
            <div class="bg-indigo-600 text-white px-2 py-1 rounded font-black text-xs shadow-lg">SRD</div>
            <p id="user-display" class="font-bold text-slate-800 text-[11px] uppercase tracking-tight"></p>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="toggleView('form')" class="text-[10px] font-black uppercase text-slate-500 hover:text-indigo-600 px-3 py-2 transition">Request</button>
            <button onclick="toggleView('history')" class="text-[10px] font-black uppercase text-slate-500 hover:text-indigo-600 px-3 py-2 transition">History</button>
            <button id="logout-btn" class="text-[10px] font-black text-red-500 uppercase ml-4 bg-red-50 px-3 py-2 rounded-xl">Logout</button>
        </div>
    </header>

    <div id="login-container" class="fixed inset-0 z-[100] flex items-center justify-center bg-slate-100 p-4">
        <div class="bg-white p-10 rounded-[3rem] shadow-2xl w-full max-w-sm border border-slate-200 text-center">
            <h2 class="text-2xl font-black text-slate-800 mb-8 tracking-tight">Workshop Login</h2>
            <div class="space-y-3">
                <input type="email" id="login-email" placeholder="Email" class="w-full bg-slate-50 border border-slate-200 p-4 rounded-2xl outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
                <input type="password" id="login-password" placeholder="Password" class="w-full bg-slate-50 border border-slate-200 p-4 rounded-2xl outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
                <button id="login-btn" class="w-full bg-indigo-600 text-white font-black py-4 rounded-2xl shadow-xl hover:bg-indigo-700 transition">Enter Portal</button>
            </div>
        </div>
    </div>

    <main id="app-container" class="hidden flex flex-col md:flex-row app-height overflow-hidden">
        
        <aside id="side-inventory" class="w-full md:w-80 lg:w-96 bg-white border-r border-slate-200 flex flex-col">
            <div class="p-4 border-b border-slate-100 bg-slate-50/50">
                <div class="flex justify-between items-center mb-3">
                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Full Inventory</label>
                    <button id="clear-search" class="text-[10px] font-bold text-indigo-600 hover:underline">Show All</button>
                </div>
                <input type="text" id="mat-search" placeholder="Search by name or ID..." class="w-full bg-white p-3.5 rounded-2xl border border-slate-200 outline-none text-sm shadow-sm focus:ring-2 focus:ring-indigo-500">
            </div>
            <div id="search-results" class="flex-1 overflow-y-auto scroll-hide p-3 space-y-2">
                </div>
        </aside>

        <section id="view-form" class="flex-1 bg-slate-50 flex flex-col overflow-hidden">
            <div class="p-4 bg-white border-b border-slate-200 grid grid-cols-2 lg:grid-cols-5 gap-3 shadow-sm z-10">
                <div>
                    <label class="text-[8px] font-black text-slate-400 uppercase ml-1">WS Code</label>
                    <input type="text" id="ws-code" placeholder="WS-XX" class="w-full bg-slate-50 p-2.5 rounded-xl border border-slate-200 outline-none text-[11px] font-bold">
                </div>
                <div>
                    <label class="text-[8px] font-black text-slate-400 uppercase ml-1">PRF Number</label>
                    <input type="text" id="prf-no" placeholder="PRF#" class="w-full bg-slate-50 p-2.5 rounded-xl border border-slate-200 outline-none text-[11px] font-bold">
                </div>
                <div>
                    <label class="text-[8px] font-black text-slate-400 uppercase ml-1">SR Reference</label>
                    <input type="text" id="sr-no" placeholder="SR#" class="w-full bg-slate-50 p-2.5 rounded-xl border border-slate-200 outline-none text-[11px] font-bold">
                </div>
                <div>
                    <label class="text-[8px] font-black text-slate-400 uppercase ml-1">WO Reference</label>
                    <input type="text" id="wo-no" placeholder="WO#" class="w-full bg-slate-50 p-2.5 rounded-xl border border-slate-200 outline-none text-[11px] font-bold">
                </div>
                <div class="col-span-2 lg:col-span-1">
                    <label class="text-[8px] font-black text-slate-400 uppercase ml-1">Asset Name</label>
                    <input type="text" id="asset-name" placeholder="Machine/Truck" class="w-full bg-slate-50 p-2.5 rounded-xl border border-slate-200 outline-none text-[11px] font-bold">
                </div>
            </div>

            <div class="flex-1 overflow-y-auto p-4 scroll-hide">
                <div class="bg-white rounded-[2.5rem] border border-slate-200 shadow-sm overflow-hidden">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-slate-50 text-[10px] font-black text-slate-400 uppercase border-b border-slate-200">
                            <tr>
                                <th class="p-4 w-10 text-center">#</th>
                                <th class="p-4">Material</th>
                                <th class="p-4 w-20">UOM</th>
                                <th class="p-4 w-24">Qty</th>
                                <th class="p-4 w-10"></th>
                            </tr>
                        </thead>
                        <tbody id="basket-body" class="divide-y divide-slate-50"></tbody>
                    </table>
                    <div id="empty-msg" class="p-20 text-center text-slate-300 italic text-xs">No items selected from inventory.</div>
                </div>
            </div>

            <div class="p-4 bg-white border-t border-slate-200">
                <button id="submit-request" class="w-full bg-indigo-600 text-white font-black py-4 rounded-2xl shadow-xl flex justify-center items-center gap-3 active:scale-[0.99] transition-all">
                    <span class="text-xs uppercase tracking-widest">Submit PRF</span>
                    <span id="basket-count" class="bg-indigo-400 px-2.5 py-1 rounded-lg text-[10px]">0</span>
                </button>
            </div>
        </section>

        <section id="view-history" class="hidden flex-1 bg-slate-50 flex flex-col overflow-hidden">
            <div class="p-6 border-b border-slate-200 bg-white"><h2 class="text-xs font-black text-slate-800 uppercase tracking-widest">Submission History</h2></div>
            <div id="history-list" class="flex-1 overflow-y-auto p-6 space-y-4 scroll-hide"></div>
        </section>
    </main>

    <div id="detail-modal" class="hidden fixed inset-0 z-[200] modal-bg flex items-center justify-end">
        <div class="w-full max-w-xl bg-white h-full shadow-2xl flex flex-col animate-slide">
            <div class="p-6 border-b border-slate-200 flex justify-between items-center bg-slate-50">
                <div><h3 id="m-prf" class="text-xl font-black text-slate-800"></h3><p id="m-meta" class="text-[9px] font-black text-slate-400 uppercase mt-1 tracking-wider"></p></div>
                <button onclick="closeModal()" class="w-10 h-10 rounded-full bg-white shadow-sm flex items-center justify-center text-slate-400 hover:text-red-500 transition-colors">✕</button>
            </div>
            <div class="flex-1 overflow-y-auto p-8 space-y-10 scroll-hide">
                <div class="space-y-4"><h4 class="text-[10px] font-black text-indigo-500 uppercase tracking-widest">Timeline</h4><div id="m-timeline" class="relative pl-6 border-l-2 border-indigo-100 space-y-6"></div></div>
                <div class="space-y-4"><h4 class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Item-Wise Status</h4><div id="m-items" class="space-y-2"></div></div>
                <div class="space-y-4">
                    <h4 class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Follow-up History</h4>
                    <div id="m-remarks-history" class="space-y-2 bg-slate-50 p-4 rounded-2xl border border-slate-100 max-h-40 overflow-y-auto"></div>
                    <div class="relative"><textarea id="m-new-remark" placeholder="Message to inventory..." class="w-full bg-slate-100 p-4 rounded-2xl border-none outline-none text-xs h-24 focus:ring-2 focus:ring-indigo-500"></textarea><button id="send-remark-btn" class="absolute bottom-2 right-2 bg-indigo-600 text-white text-[9px] font-black px-4 py-2 rounded-xl">SEND</button></div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
        import { getDatabase, ref, onValue, get, push, update } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCLdwgFDeZRPGg666z5Vm9ZGJ74QfsP1Hg",
            authDomain: "srdprf-2026.firebaseapp.com",
            projectId: "srdprf-2026",
            databaseURL: "https://srdprf-2026-default-rtdb.firebaseio.com/",
            storageBucket: "srdprf-2026.firebasestorage.app",
            messagingSenderId: "736052583789",
            appId: "1:736052583789:web:5828ad0e5beb3b15218e64"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let masterInventory = [], basket = [], currentPrfKey = null;

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const snap = await get(ref(db, 'authorized_emails/' + user.email.toLowerCase().replace(/\./g, ',')));
                if (snap.exists() && snap.val().role === 'workshop') {
                    document.getElementById('login-container').classList.add('hidden');
                    document.getElementById('nav-bar').classList.remove('hidden');
                    document.getElementById('app-container').classList.remove('hidden');
                    document.getElementById('user-display').innerText = user.email.split('@')[0];
                    loadInventory(); loadHistory(user.email);
                } else { signOut(auth); }
            } else { 
                document.getElementById('login-container').classList.remove('hidden');
                document.getElementById('nav-bar').classList.add('hidden');
                document.getElementById('app-container').classList.add('hidden');
            }
        });

        window.toggleView = (v) => {
            document.getElementById('view-form').classList.toggle('hidden', v !== 'form');
            document.getElementById('side-inventory').classList.toggle('hidden', v !== 'form');
            document.getElementById('view-history').classList.toggle('hidden', v !== 'history');
        };

        // --- SMART INVENTORY LOADER ---
        function loadInventory() {
            const container = document.getElementById('search-results');
            container.innerHTML = '<div class="p-10 text-center text-[10px] font-black text-slate-400 animate-pulse uppercase">Syncing Database...</div>';

            const invRef = ref(db, 'inventory_list'); // Verify this path in Firebase
            
            onValue(invRef, (snap) => {
                masterInventory = [];
                if (snap.exists()) {
                    snap.forEach(child => {
                        const d = child.val();
                        masterInventory.push({ 
                            ItemID: d.ItemID || d.id || d.code || child.key, 
                            ProductName: d.ProductName || d.name || d.item || d.description || "Unnamed Item", 
                            Unit: d.Unit || d.Uom || d.uom || 'PCS' 
                        });
                    });
                    renderInv(masterInventory);
                } else {
                    container.innerHTML = '<p class="p-10 text-center text-red-400 text-[10px] font-black uppercase">No items found in "inventory_list"</p>';
                }
            }, (err) => {
                container.innerHTML = `<p class="p-10 text-center text-red-500 text-[10px] font-black uppercase">Error: ${err.message}</p>`;
            });
        }

        function renderInv(list) {
            const container = document.getElementById('search-results');
            if (list.length === 0) {
                container.innerHTML = '<p class="text-center text-slate-400 text-[10px] p-10 font-bold uppercase">No matches</p>';
                return;
            }
            container.innerHTML = list.map(i => `
                <div onclick='addToBasket(${JSON.stringify(i)})' class="p-3 bg-white border border-slate-200 rounded-xl hover:border-indigo-400 cursor-pointer shadow-sm group active:bg-indigo-50 transition-all">
                    <div class="font-bold text-slate-800 text-[11px] group-hover:text-indigo-600 truncate">${i.ProductName}</div>
                    <div class="flex justify-between text-[9px] text-slate-400 mt-1 font-black uppercase tracking-tighter">
                        <span>ID: ${i.ItemID}</span><span class="text-indigo-400">${i.Unit}</span>
                    </div>
                </div>
            `).join('');
        }

        document.getElementById('mat-search').addEventListener('input', (e) => {
            const q = e.target.value.toLowerCase();
            renderInv(masterInventory.filter(i => i.ProductName.toLowerCase().includes(q) || i.ItemID.toLowerCase().includes(q)));
        });

        document.getElementById('clear-search').addEventListener('click', () => { 
            document.getElementById('mat-search').value = ''; 
            renderInv(masterInventory); 
        });

        window.addToBasket = (i) => {
            if (basket.find(b => b.ItemID === i.ItemID)) return;
            basket.push({ ...i, qty: 1, itemStatus: 'Pending' }); renderBasket();
        };

        function renderBasket() {
            document.getElementById('basket-count').innerText = basket.length;
            document.getElementById('empty-msg').classList.toggle('hidden', basket.length > 0);
            document.getElementById('basket-body').innerHTML = basket.map((i, idx) => `
                <tr class="text-[11px]">
                    <td class="p-4 text-slate-300 font-bold text-center">${idx + 1}</td>
                    <td class="p-4"><div class="font-bold text-slate-700 leading-tight">${i.ProductName}</div><div class="text-[9px] text-slate-400 font-mono">${i.ItemID}</div></td>
                    <td class="p-4 font-black text-slate-400 uppercase">${i.Unit}</td>
                    <td class="p-4"><input type="number" value="${i.qty}" onchange="basket[${idx}].qty=this.value" class="w-full bg-slate-50 p-2 rounded-lg font-bold text-center border-none"></td>
                    <td class="p-4 text-right"><button onclick="basket.splice(${idx},1);renderBasket()" class="text-slate-300 hover:text-red-500">✕</button></td>
                </tr>
            `).join('');
        }

        function loadHistory(email) {
            onValue(ref(db, 'prfs'), (snap) => {
                const list = document.getElementById('history-list');
                let entries = [];
                snap.forEach(c => { if(c.val().createdBy === email) entries.push({ ...c.val(), key: c.key }); });
                entries.sort((a,b) => b.timestamp - a.timestamp);
                list.innerHTML = entries.map(e => `
                    <div onclick='showDetails(${JSON.stringify(e)})' class="bg-white p-5 rounded-3xl border border-slate-200 shadow-sm flex justify-between items-center cursor-pointer hover:border-indigo-400 transition-all">
                        <div class="space-y-1">
                            <div class="flex items-center gap-2"><span class="bg-indigo-50 text-indigo-600 px-2 rounded text-[9px] font-black tracking-widest">${e.wsCode || 'NA'}</span><h4 class="font-black text-slate-800 text-sm tracking-tight">${e.prfNo}</h4></div>
                            <p class="text-[9px] text-slate-400 font-bold uppercase">Asset: ${e.assetName || 'N/A'} • SR: ${e.srNo || '-'} • WO: ${e.woNo || '-'}</p>
                        </div>
                        <span class="text-[9px] font-black px-3 py-1 rounded-full uppercase tracking-widest ${e.status === 'Delivered' ? 'bg-emerald-100 text-emerald-600' : 'bg-amber-100 text-amber-600'}">${e.status}</span>
                    </div>
                `).join('');
            });
        }

        window.showDetails = (e) => {
            currentPrfKey = e.key;
            document.getElementById('m-prf').innerText = e.prfNo;
            document.getElementById('m-meta').innerText = `Asset: ${e.assetName || 'N/A'} • SR: ${e.srNo} • WO: ${e.woNo}`;
            document.getElementById('m-timeline').innerHTML = `
                <div class="relative"><div class="absolute -left-[31px] top-1 w-4 h-4 bg-emerald-500 rounded-full border-4 border-white"></div><p class="text-xs font-black">Submitted</p></div>
                ${e.prNo ? `<div class="relative"><div class="absolute -left-[31px] top-1 w-4 h-4 bg-indigo-600 rounded-full border-4 border-white"></div><p class="text-xs font-black uppercase">Purchase Req: ${e.prNo}</p></div>` : ''}
                <div class="relative"><div class="absolute -left-[31px] top-1 w-4 h-4 ${e.status === 'Delivered' ? 'bg-emerald-500' : 'bg-slate-200'} rounded-full border-4 border-white"></div><p class="text-xs font-black uppercase">Current: ${e.status}</p></div>
            `;
            document.getElementById('m-items').innerHTML = e.items.map(i => {
                const s = (i.itemStatus || 'Pending').toLowerCase();
                const cls = s === 'received' ? 'status-received' : (s === 'cancelled' ? 'status-cancelled' : 'status-pending');
                return `<div class="flex justify-between bg-white p-3 rounded-2xl border border-slate-100 shadow-sm"><div><p class="text-[11px] font-black">${i.ProductName}</p><p class="text-[9px] text-slate-400 font-bold">${i.qty} ${i.Unit}</p></div><span class="text-[8px] font-black px-3 py-1.5 rounded-lg uppercase tracking-widest ${cls}">${i.itemStatus || 'Pending'}</span></div>`
            }).join('');
            document.getElementById('m-remarks-history').innerHTML = (e.remarksHistory || []).map(r => `<div class="p-3 rounded-2xl text-[10px] ${r.sender === 'workshop' ? 'bg-indigo-50 border-l-2 border-indigo-500' : 'bg-white border shadow-sm'}"><p class="font-black opacity-50 uppercase text-[7px] mb-1">${r.sender} • ${new Date(r.time).toLocaleTimeString()}</p>${r.msg}</div>`).join('') || '<p class="text-center text-slate-300 text-[10px] py-4 italic">No communication history yet.</p>';
            document.getElementById('detail-modal').classList.remove('hidden');
        };

        window.closeModal = () => document.getElementById('detail-modal').classList.add('hidden');

        document.getElementById('send-remark-btn').addEventListener('click', async () => {
            const msg = document.getElementById('m-new-remark').value.trim();
            if(!msg) return;
            const snap = await get(ref(db, `prfs/${currentPrfKey}/remarksHistory`));
            const history = snap.exists() ? snap.val() : [];
            history.push({ msg, sender: 'workshop', time: Date.now() });
            await update(ref(db, `prfs/${currentPrfKey}`), { remarksHistory: history });
            document.getElementById('m-new-remark').value = '';
            showDetails((await get(ref(db, `prfs/${currentPrfKey}`))).val());
        });

        document.getElementById('submit-request').addEventListener('click', async () => {
            const prf = document.getElementById('prf-no').value.trim(), ws = document.getElementById('ws-code').value.trim();
            if (!prf || !ws || !basket.length) return alert("Fill PRF#, WS Code, and select items.");
            const data = {
                wsCode: ws, prfNo: prf, assetName: document.getElementById('asset-name').value,
                srNo: document.getElementById('sr-no').value, woNo: document.getElementById('wo-no').value,
                items: basket, status: 'Pending', createdBy: auth.currentUser.email,
                timestamp: Date.now(), remarksHistory: []
            };
            await push(ref(db, 'prfs'), data);
            alert("PRF Successfully Submitted");
            basket = []; renderBasket();
            ['prf-no','ws-code','sr-no','wo-no','asset-name'].forEach(i => document.getElementById(i).value='');
            toggleView('history');
        });

        document.getElementById('login-btn').addEventListener('click', () => {
            signInWithEmailAndPassword(auth, document.getElementById('login-email').value, document.getElementById('login-password').value).catch(e => alert(e.message));
        });
        document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));
    </script>
</body>
</html>
